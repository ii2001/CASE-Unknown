[project]
name = "case-unknown"
version = "0.1.0"
description = "A deterministic generative-AI detective game"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.34",
  "pydantic-settings>=2.7",
  "langchain>=0.3",
  "langgraph>=0.4",
  "langchain-google-genai>=2.1",
  "langchain-openai>=1.0",
]

[project.optional-dependencies]
dev = ["httpx>=0.28", "pytest>=8.3", "ruff>=0.11"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
